# IP de cada máquina en la red de datos. Salen del inventario que genera
# OpenTofu (variable ip_datos de cada host), así no se repiten aquí a mano
ip_web: "{{ hostvars[groups['servidores_web'][0]]['ip_datos'] }}"
ip_bd: "{{ hostvars[groups['servidores_bd'][0]]['ip_datos'] }}"
ip_bastion: "{{ hostvars[groups['bastion'][0]]['ip_datos'] }}"

# Base de datos de la aplicación
bd_nombre: guestbook
bd_usuario: guestbook
bd_password: "{{ vault_bd_password }}"   # cifrada en vault.yaml

# Aplicación: repositorio y versión (commit) que se despliega
app_repo_raw: https://raw.githubusercontent.com/josedom24/guestbook_php
app_version: a5b6c516e2aab8449e1e838284b2eff97813251d

# IP del anfitrión en la red NAT: es el único que puede entrar al bastión por SSH
ip_anfitrion: 192.168.140.1
