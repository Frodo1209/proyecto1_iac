- name: Actualizar el sistema
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist
    lock_timeout: 300

- name: Instalar paquetes comunes
  ansible.builtin.apt:
    name: "{{ paquetes_comunes }}"
    state: present

- name: Resolver los nombres de las máquinas por la red de datos
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s{{ item }}-datos$'
    line: "{{ hostvars[item]['ip_datos'] }} {{ item }}-datos"
  loop: "{{ groups['all'] }}"
