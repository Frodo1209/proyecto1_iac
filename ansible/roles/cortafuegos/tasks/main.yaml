- name: Instalar nftables
  ansible.builtin.apt:
    name: nftables
    state: present

# nft -c comprueba la sintaxis sin aplicar nada
- name: Reglas del cortafuegos
  ansible.builtin.template:
    src: cortafuegos.nft.j2
    dest: /etc/cortafuegos.nft
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Recargar cortafuegos

- name: Servicio que carga el cortafuegos en cada arranque
  ansible.builtin.template:
    src: cortafuegos.service.j2
    dest: /etc/systemd/system/cortafuegos.service
    mode: "0644"
  notify: Recargar cortafuegos

- name: Activar el cortafuegos
  ansible.builtin.systemd_service:
    name: cortafuegos
    state: started
    enabled: true
    daemon_reload: true
